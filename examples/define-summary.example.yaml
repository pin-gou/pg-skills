# define-summary.example.yaml
# 示例: pg-1-define 阶段产出的定界结论（含验证方法）
# 用户在定界后授权调 describe_env 看真实环境，再与 agent 共同讨论每个 V-* 的可验证性
# 字段必须严格符合 .pg/skills/src/runtime/spec/define-summary.schema.json

schema_version: 1
change_id: add-bucket-s3-info
defined_at: "2026-08-05T10:00:00Z"
defined_by: define
target_environment: dev-local

problem: >-
  对象存储桶创建后，列表页无法展示桶的实际占用容量与对象数量，
  运维排查存储水位时只能逐个桶调 API，效率低。

solution: >-
  在桶列表 API 响应中补充 capacity_bytes 与 object_count 两个聚合字段，
  后端从对象存储网关统计接口拉取，前端列表列渲染。

boundary:
  in_scope:
    - 桶列表 API 新增 capacity_bytes / object_count 字段
    - 前端桶列表新增"容量"列
    - 统计拉取的超时与降级（字段缺省为 null）
  out_of_scope:
    - 桶的写入限流
    - 历史容量趋势图表

verification_needs:
  - id: V-backend-1
    # track_id 字段可选, 省略时自动从 id 按 ^V-([a-z][a-z0-9-]*)- 派生
    name: 桶列表返回容量字段
    what: >-
      调用桶列表 API，响应中每个桶包含 capacity_bytes 与 object_count。
    requires_capabilities:
      - capability: object_storage
        min_quantity: 1
        description: 至少 1 个可访问的对象存储实例 + 1 个已存在桶
      - capability: postgresql
        min_quantity: 1
    downgrade_when_missing: >-
      对象存储不可用 → 后端统计接口 mock 返回固定值，仅验证字段透传。
    post_discussion_status: verifiable
    env_resource_refs:
      - "{env.infra_services[name=object-storage]}"
      - "{env.data_resources[name=bucket-catalog]}"

  - id: V-backend-2
    name: 统计接口超时降级
    what: >-
      对象存储统计接口超时时，capacity_bytes / object_count 缺省为 null，列表仍正常返回。
    requires_capabilities:
      - capability: object_storage
        min_quantity: 1
    downgrade_when_missing: >-
      无法注入超时 → 用单元测试 mock 超时路径，scenario 标 @skip。
    post_discussion_status: degraded

  - id: V-backend-3
    name: 多租户隔离
    what: >-
      租户 A 只能看到自己的桶容量，不能看到租户 B。
    requires_capabilities:
      - capability: multi_tenant_data
        min_quantity: 2
        description: 至少 2 个租户 + 各 1 个桶
    post_discussion_status: skipped

risks:
  - 对象存储统计接口为全量扫描，桶数量大时列表延迟上升（需加缓存）
open_questions:
  - capacity_bytes 是否需要单位换算（前端展示 GB）？
