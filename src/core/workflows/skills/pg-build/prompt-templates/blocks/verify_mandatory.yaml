# verify_mandatory.yaml — 集成验证硬性约束指令块（v3.x）
#
# 注入时机：dispatch_file 生成时，检测 stage.environment.required=true 时自动注入
# 注入位置：dispatch_file 末尾，子 agent 返回契约之前
#
# 本块与 verify.md agent 协议的 "启动失败处理" 小节联动：
#   - verify.md 定义行为规则
#   - 本块提供 dispatch 时注入的上下文

verify_mandatory: |
  ## 集成验证硬性约束（v3.x）

  当前 stage 的 `environment.required=true`，**集成验证不可 SKIP**。

  ### 约束规则

  1. **禁止 SKIP**：任何 V-* 验证项都必须真实运行，不能标记 SKIP 豁免
  2. **启动失败重试**：服务启动失败最多重试 3 次，超限返回 `status: "fail"`
  3. **立即 escalate**：V-* 项发现代码 bug 时**立即**返回 `status: "escalate"`，
     不要 accumulate 多项失败后再 escalate
  4. **环境问题 = 修复环境**：环境无法启动属于配置/依赖问题，由人工修复；

  ### 验证项

  以下 V-* 项必须全部执行（不能 SKIP，不能 partial）：

  {tasks_preformatted}

  ### 启动失败处理

  1. 第 1-2 次失败：检查日志，尝试修复后再启动
  2. 第 3 次失败：返回 `status: "fail"`，错误码 `ENV_STARTUP_RETRY_EXCEEDED`

  ### 🔴 运行时启动 + 健康探针（B3 修复，v3.x 强制项）

  2026-08-02 `terminal-command-whitelist-guard` 暴露 verify 阶段只跑单元测试、
  不启动服务，导致 `TerminalCommandGuardService` 多构造函数缺 `@Autowired` /
  `WhitelistMatcher` 生产路径 stub 等 P0 bug 全部漏到 int.scr 才暴露。

  **执行顺序**（所有 V-* 验证项**之前**必做）：

  1. **启动服务**（若当前未运行）：
     ```bash
     python3 .pg/skills/src/runtime/bin/pg-invoke-hook.py invoke-hook \
         --session {_change} --env {env_name} --action restart_all_instances \
         --skill pg-build
     ```
  2. **等待就绪**：30 次 × 3s 轮询 HTTP/进程探针（backend → curl 探针，
     agent/agent-vm → systemctl is-active）
  3. **真实 e2e**（至少 1 次）：触发本次变更的核心链路（终端 WebSocket / CRUD /
     CLI），断言输出与预期一致
  4. **失败处置**：启动失败 / 探针 30 次未就绪 / e2e 不符合预期 → 立即报告
     `service_startup FAIL`，返回 `status: "escalate"`，所有 V-* 记 FAIL。

  **写盘要求**：报告中必须含上述 4 步的原始输出或日志片段，缺一项 gate
  agent 应判 verify 不合格。

  ### Spring Bean 装配自查（runtime_boot check 辅助项）

  对本次 git diff 中**新增/修改的 @Service/@Component 类**：

  - 统计非 private 构造函数数量；若 > 1，必须至少一个标注 `@Autowired`，
    否则 `NoSuchMethodException: <Class>.<init>()`（Spring 无法装配）
  - 检查构造参数类型是否注册为 bean（同模块内有 @Service/@Component 或
    starter 自动装配）
  - 检查是否存在"测试替身 + 生产 stub"模式（如 `if (testRules != null) return
    testRules; else return Collections.emptyList();`）

  任一命中 → 报告 `runtime_boot FAIL`，返回 escalate。
