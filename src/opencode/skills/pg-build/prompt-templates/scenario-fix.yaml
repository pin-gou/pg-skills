# scenario-fix.yaml — sub=scenario-fix 完整提示词

prompt: |
  ### 场景修复（scenario-fix）

  本 phase 是 scenario-execute escalate 触发的子 pipeline。
  你的任务是**先分类失败根因**，再决定修复动作：
  - 根因是**代码缺陷** → 修改代码、跑测试、record status=completed/failed
  - 根因是**环境漂移 / 设计缺陷** → 不改代码，record 并标注根因分类，由编排器终止 pipeline

  ### 必读源报告（scenario-execute ESCALATE 派发）

  - **源 scenario-execute 报告**: {verify_report_path}
  - **失败 scenario_id 列表**: {failed_scenarios_inline}

  请用 Read 工具逐字读取源报告。报告包含 scenario-execute agent 记录的
  escalate 详情、每个失败 Scenario 的断言级结果、HTTP 响应/日志片段/stack trace 等完整上下文。

  ### 修复范围

  - fix_cycle: {fix_cycle}
  - 只修复源 scenario-execute 报告中列出的失败 Scenario
  - 不要引入超出修复范围的新功能

  ### 模块路径约束

  禁止编辑以下路径的文件：
  - 不在 {module_roots} 路径下的文件
  - scenario-*.yaml（SSOT，**禁止修改**；如需修改须重跑 `pg-gen-scenario.py` 重新生成 skeleton）

  ### 根因分类契约（v1.1.0 / P1-3，强制）

  修复前**必须**先判定根因类型，调 `pg-build-result` 时用 `--fix-root-cause` 标注。
  编排器据此路由，分类错误会导致无效重跑或误终止：

  | fix_root_cause | 含义 | 编排器行为 | 你要做的事 |
  |----------------|------|-----------|-----------|
  | `code_bug` | 代码缺陷（缺分支/契约错位/迁移漏字段） | fix 完成后**重跑 scenario-execute** | 改代码 → 跑测试 → record status=completed |
  | `env_drift` | 环境漂移，**未修复** | **workflow_failed 终止**（重跑无意义） | 不改代码，record 标注根因；需人工重新 describe_env / 修环境 |
  | `env_drift` + `--env-fix-applied` | 环境漂移，**已修复**（v3.14） | **重跑 scenario-execute** | 执行环境修复动作（restart/rebuild/deploy）→ record 附带 `--env-fix-applied` |
  | `design_drift` | design.md 与实现契约不一致 | **workflow_failed 终止** | 不改代码，record 标注根因；需人工重跑 /2-pg-propose 修 design.md |

  **判定要点**：
  - 失败源于「代码该做的没做对」→ `code_bug`
  - 失败源于「环境/依赖现状与 scenario 预期不符」且无法靠改本仓代码解决 → `env_drift`
  - 失败源于「design.md 定义的契约本身有缺陷/与现状矛盾」→ `design_drift`
  - 缺省（不传 `--fix-root-cause`）按 `code_bug` 处理

  **env_fix_applied 判定（v3.14 修复 2）**：
  - 环境漂移可通过本仓工具链自动修复（如 `pg-invoke-hook.py` 重启 role、
    重建并部署二进制、重新执行 prepare_env hook）→ 执行修复动作并验证生效后，
    record 时附带 `--fix-root-cause env_drift --env-fix-applied`
  - 环境漂移需人工介入（如 describe_env 需重跑、外部依赖根本性损坏）→
    仅 record `--fix-root-cause env_drift`（不带 --env-fix-applied）

  **design_drift 必须附带 `--design-drift` JSON**（累积到 drift.md 供审计）：
  ```
  --design-drift '{{"phase":"scenario-fix","scenario_id":"<S-xxx>","location":"<design.md 章节/字段>","reason":"<契约偏移说明>","decision":"ACCEPT"}}'
  ```

  ### 修复后必跑流程（code_bug 路径）

  1. 修改源码
  2. 跑 {test_commands} 单元测试（必须通过）
  3. 跑模块 lint（必须 0 警告）
  4. 写修复报告到 `2-build/{fix_report_filename}`
  5. 调 `pg-build-result` 落盘 result.json：`--fix-root-cause code_bug`（status=completed 或 failed）

  ### 非代码路径必跑流程（env_drift / design_drift）

  1. **不改任何源码**
  2. 写诊断报告到 `2-build/{fix_report_filename}`，说明根因证据与所需人工动作
  3. 调 `pg-build-result` 落盘 result.json：`--fix-root-cause env_drift`（或 `design_drift`），design_drift 附带 `--design-drift` JSON
  4. record status=completed（编排器读到根因分类后自动终止 workflow，而非重跑）

  ### 环境可自动修复路径（env_drift + env_fix_applied，v3.14）

  若环境漂移可用本仓工具链自动修复（重启 role / 重建部署二进制 / 重跑 prepare_env）：

  1. **不改任何源码**
  2. 执行修复动作并**验证生效**（如 `pg-invoke-hook.py --action restart` + 健康检查通过）
  3. 写修复报告到 `2-build/{fix_report_filename}`，含修复动作与验证证据
  4. 调 `pg-build-result` 落盘 result.json：`--fix-root-cause env_drift --env-fix-applied`
  5. record status=completed（编排器自动重跑 scenario-execute，不再终止 workflow）

  ### 修复策略指引

  修复时按以下顺序定位根因：

  1. **业务逻辑错误**：对照 design.md / scenario-<track>.yaml 的 When/Then 描述，看是否漏处理某个分支
  2. **API 契约错误**：检查 Controller 注解、DTO 字段、序列化顺序
  3. **前后端契约错位**：检查前端 API 调用与后端响应字段命名/类型
  4. **数据库/迁移问题**：检查 Flyway 脚本、Entity 字段映射
  5. **环境/配置问题**：仅当 design.md 明确要求新配置时才改，否则不碰

  ### 写盘要求

  完成修复后，自行用 `cat >` 写盘到 `2-build/{fix_report_filename}`，含：
  - 修复的 scenario_id 列表
  - 修改的文件列表（含绝对路径 + 行号）
  - 单元测试通过证据（命令输出最后 50 行）
  - 修复策略说明（哪类根因 + 关键 diff）
